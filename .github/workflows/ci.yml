name: CI

on:
  push:
    branches: ["foundation-security-finalize"]
  pull_request:
    branches: ["main"]

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: montikids
          POSTGRES_USER: montikids
          POSTGRES_PASSWORD: montikids-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U montikids -d montikids"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://montikids:montikids-ci@localhost:5432/montikids
      SESSION_TTL_HOURS: 8
      STORAGE_DIR: ./data/uploads
      MAX_UPLOAD_BYTES: 10485760
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate
      - name: Verify bootstrap administrator
        run: |
          PASSWORD="CiOnly$(openssl rand -hex 16)Aa1"
          npm run db:seed-admin -- --email=ci-admin@example.invalid --name="CI Administrator" --password="$PASSWORD"
      - run: node scripts/verify-foundation.mjs
      - run: npm run typecheck
      - run: npm run build
