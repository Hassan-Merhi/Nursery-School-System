services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: montikids
      POSTGRES_USER: montikids
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - montikids_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U montikids -d montikids"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  montikids_postgres:
